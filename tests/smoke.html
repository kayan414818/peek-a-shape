<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Peek-a-Shape 冒煙測試</title>
<link rel="stylesheet" href="../css/styles.css" />
<style>
  #smoke { position: fixed; left: 0; top: 0; right: 0; z-index: 9999; max-height: 45vh; overflow: auto;
    background: #101820; color: #dfe8f0; font: 12px ui-monospace, Menlo, monospace; padding: 10px; }
  #smoke .p { color: #7ee787; } #smoke .f { color: #ff7b72; } #smoke h2 { font-size: 14px; margin: 0 0 6px; }
</style>
</head>
<body>
  <div id="smoke">running…</div>

  <div id="app">
    <header id="topbar">
      <div class="brand">🎲 <span class="zh" id="brand-name">立體探秘樂</span></div>
      <div class="spacer"></div>
      <nav class="modes">
        <button class="pill home" id="btn-home">主頁</button>
      </nav>
      <button class="pill lang" id="btn-lang">EN</button>
    </header>
    <div id="main">
      <div id="stage-wrap" style="position:relative;flex:1 1 64%;min-width:0;min-height:0;display:flex;">
        <div id="stage"></div>
      </div>
      <aside id="panel"></aside>
    </div>
  </div>

  <script>
    window.__SMOKE_ERRORS__ = [];
    window.addEventListener('error', function (e) {
      window.__SMOKE_ERRORS__.push('window.onerror: ' + (e.message || e.error) + ' @ ' + e.lineno + ':' + e.colno);
    });
    window.addEventListener('unhandledrejection', function (e) {
      window.__SMOKE_ERRORS__.push('unhandledrejection: ' + e.reason);
    });
  </script>

  <script src="../lib/three.min.js"></script>
  <script src="../js/geometry.js"></script>
  <script src="../js/clip.js"></script>
  <script src="../js/nets.js"></script>
  <script src="../js/i18n.js"></script>
  <script src="../js/viewer.js"></script>
  <script src="../js/app.js"></script>

  <script>
  (function () {
    'use strict';
    var ERRORS = window.__SMOKE_ERRORS__;
    var results = [];
    function check(name, fn) {
      try { fn(); results.push({ name: name, pass: true }); }
      catch (e) { results.push({ name: name, pass: false, msg: (e && e.message) ? e.message : String(e) }); }
    }
    var IDS = ['cube','cuboid','triPrism','quadPrism','pentaPrism','hexaPrism',
      'triPyramid','quadPyramid','pentaPyramid','cylinder','cone','sphere'];

    function finish() {
      var pass = results.filter(function (r) { return r.pass; }).length;
      var fail = results.length - pass;
      var el = document.getElementById('smoke');
      var html = '<h2>SMOKE: ' + results.length + ' checks — ' + pass + ' pass, ' + fail + ' fail; ' +
        'runtime errors: ' + ERRORS.length + '</h2>';
      results.forEach(function (r) {
        html += '<div class="' + (r.pass ? 'p' : 'f') + '">' + (r.pass ? 'PASS ' : 'FAIL ') + r.name +
          (r.msg ? ' — ' + r.msg : '') + '</div>';
      });
      ERRORS.forEach(function (m) { html += '<div class="f">ERR ' + m + '</div>'; });
      el.innerHTML = html;
      window.__SMOKE_RESULTS__ = results;
      window.__SMOKE_SUMMARY__ = { total: results.length, pass: pass, fail: fail, errors: ERRORS.length };
    }

    function run() {
      try { runInner(); } catch (e) { ERRORS.push('run threw: ' + ((e && e.stack) || e)); }
      finish();
    }

    function runInner() {
      var A = PS.app, st = A.state, T = PS.i18n, V = PS.V, G = PS.geo, C = PS.clip;
      var viewer = A._test.getViewer();

      check('app initialised (viewer created)', function () { if (!viewer) throw new Error('viewer is null'); });
      check('no runtime errors during init', function () { if (ERRORS.length) throw new Error(ERRORS.length + ' errors'); });

      // 1. 三個模組 × 全部立體，都能渲染
      ['inspect', 'unfold', 'cut'].forEach(function (mode) {
        check('go(' + mode + ')', function () { A._test.go(mode); });
        IDS.forEach(function (id) {
          check(mode + ' render ' + id, function () {
            st.shape = id;
            A._test.render();
            if (!document.getElementById('panel').childNodes.length) throw new Error('empty panel');
          });
        });
      });

      // 2. 觀察：開關
      check('inspect toggles', function () {
        A._test.go('inspect'); st.shape = 'cylinder';
        st.inspect.edges = true; st.inspect.verts = true; st.inspect.auto = true; A._test.render();
        st.inspect.edges = false; st.inspect.verts = false; st.inspect.auto = false; A._test.render();
      });

      // 3. 展開：變體 + 滑桿事件 + 對應 + 題目
      check('unfold variant cycle + slider', function () {
        A._test.go('unfold'); st.shape = 'cube'; st.unfold.variant = 0; st.unfold.t = 0; A._test.render();
        // 用滑桿事件
        var rng = document.querySelector('#panel .slider');
        if (!rng) throw new Error('no fold slider');
        rng.value = 60; rng.dispatchEvent(new Event('input'));
        if (Math.abs(st.unfold.t - 0.4) > 1e-6) throw new Error('slider did not set t=' + st.unfold.t);
        // 變體按鈕
        var before = st.unfold.variant;
        var btn = document.querySelector('#panel .btn.ghost.block');
        if (btn) { btn.click(); if (st.unfold.variant === before) throw new Error('variant did not change'); }
      });

      // 換展開圖時，立體在舞台上的顯示大小必須完全不變（同一立體共用鏡頭距離）
      check('unfold switching net keeps solid size', function () {
        A._test.go('unfold'); st.shape = 'cube'; st.unfold.variant = 0; st.unfold.t = 1; A._test.render();
        var vw = A._test.getViewer();
        function solidBox() {
          vw.renderer.render(vw.scene, vw.camera);
          var tmp = new THREE.Vector3(), mnx = 9, mxx = -9, mny = 9, mxy = -9;
          vw._content.children.forEach(function (m) {
            if (!m.geometry || !m.geometry.attributes.position) return;
            var pos = m.geometry.attributes.position;
            m.updateMatrixWorld(true);
            for (var i = 0; i < pos.count; i++) {
              tmp.fromBufferAttribute(pos, i).applyMatrix4(m.matrixWorld).project(vw.camera);
              if (tmp.x < mnx) mnx = tmp.x; if (tmp.x > mxx) mxx = tmp.x;
              if (tmp.y < mny) mny = tmp.y; if (tmp.y > mxy) mxy = tmp.y;
            }
          });
          return { w: mxx - mnx, h: mxy - mny };
        }
        var r0 = vw.radius, b0 = solidBox();
        var seen = [];
        for (var v = 1; v < PS.nets.variants('cube'); v++) {
          st.unfold.variant = v; A._test.render();
          if (Math.abs(vw.radius - r0) > 1e-6) throw new Error('camera moved at v' + v + ': ' + vw.radius.toFixed(4) + ' vs ' + r0.toFixed(4));
          var b = solidBox();
          if (Math.abs(b.w - b0.w) > 2e-3 || Math.abs(b.h - b0.h) > 2e-3) {
            throw new Error('solid size changed at v' + v + ': ' + b.w.toFixed(3) + 'x' + b.h.toFixed(3) + ' vs ' + b0.w.toFixed(3) + 'x' + b0.h.toFixed(3));
          }
          seen.push(b.w.toFixed(3));
        }
        if (seen.length !== PS.nets.variants('cube') - 1) throw new Error('not all variants checked');
        // 攤平後每個展開圖仍要完整入鏡
        for (var v2 = 0; v2 < PS.nets.variants('cube'); v2++) {
          st.unfold.variant = v2; st.unfold.t = 0; A._test.render();
          var f = solidBox();
          if (f.w > 1.66 || f.h > 1.66) throw new Error('net overflows at v' + v2 + ': ' + f.w.toFixed(2) + 'x' + f.h.toFixed(2));
        }
        st.unfold.variant = 0; st.unfold.t = 1; A._test.render();
      });

      // 球體沒有展開圖：舞台上仍要顯示球體，而且大小適中、居中
      check('unfold sphere still shows a sphere', function () {
        A._test.go('unfold'); st.shape = 'sphere'; st.unfold.variant = 0; st.unfold.t = 1; A._test.render();
        var vw = A._test.getViewer();
        if (!vw.solid || vw.solid.id !== 'sphere') throw new Error('sphere not shown in stage');
        if (!vw.meshes.length) throw new Error('no sphere mesh');
        vw.renderer.render(vw.scene, vw.camera);
        var tmp = new THREE.Vector3(), mnx = 9, mxx = -9, mny = 9, mxy = -9;
        vw.meshes.forEach(function (m) {
          var a = m.geometry.attributes.position;
          m.updateMatrixWorld(true);
          for (var i = 0; i < a.count; i++) {
            tmp.fromBufferAttribute(a, i).applyMatrix4(m.matrixWorld).project(vw.camera);
            if (tmp.x < mnx) mnx = tmp.x; if (tmp.x > mxx) mxx = tmp.x;
            if (tmp.y < mny) mny = tmp.y; if (tmp.y > mxy) mxy = tmp.y;
          }
        });
        var w = mxx - mnx, h = mxy - mny, cx = (mnx + mxx) / 2, cy = (mny + mxy) / 2;
        if (w < 0.2 || h < 0.2) throw new Error('sphere too small: ' + w.toFixed(2) + 'x' + h.toFixed(2));
        if (w > 1.3 || h > 1.3) throw new Error('sphere too big: ' + w.toFixed(2) + 'x' + h.toFixed(2));
        if (Math.abs(cx) > 0.02 || Math.abs(cy) > 0.02) throw new Error('sphere not centred: ' + cx.toFixed(3) + ',' + cy.toFixed(3));
        // 畫面比例：球體在螢幕上要是圓的（NDC 寬高比 = 舞台寬高比倒數）
        var aspect = vw._w / vw._h;
        if (Math.abs(w * aspect - h) > 0.02) throw new Error('sphere not round on screen: ' + (w * aspect).toFixed(3) + ' vs ' + h.toFixed(3));
        // 換去其他立體再回來，仍然正常
        st.shape = 'cube'; A._test.render();
        st.shape = 'sphere'; A._test.render();
        if (!vw.solid || vw.solid.id !== 'sphere') throw new Error('sphere lost after switching shapes');
        // 沒有展開圖，所以不應出現摺合滑桿
        if (document.querySelector('#panel .slider')) throw new Error('fold slider should not show for sphere');
      });

      check('unfold pick group renders', function () {
        A._test.go('unfold'); st.shape = 'cube'; st.unfold.pickGroup = 0; A._test.render();
        st.unfold.pickGroup = -1; A._test.render();
      });

      // 展開圖按鈕：要顯示百分比例，並跟隨滑桿更新
      check('unfold auto button follows percentage', function () {
        A._test.go('unfold'); st.shape = 'cube'; st.unfold.t = 0; A._test.render();
        var btn = document.getElementById('btn-auto-fold');
        if (!btn) throw new Error('no auto-fold button');
        if (!/\(\d+%\)/.test(btn.textContent)) throw new Error('no percentage on button: ' + btn.textContent);
        if (!/\(100%\)/.test(btn.textContent)) throw new Error('expected 100%: ' + btn.textContent);
        var rng = document.querySelector('#panel .slider');
        rng.value = '60';
        rng.dispatchEvent(new Event('input', { bubbles: true }));
        var pct = document.querySelector('#panel .pct');
        if (pct.textContent !== '60%') throw new Error('pct not updated: ' + pct.textContent);
        if (!/\(60%\)/.test(btn.textContent)) throw new Error('button pct not updated: ' + btn.textContent);
        st.unfold.t = 0; A._test.render();
      });

      // 展開圖考驗：答錯兩次機制（第一次錯只給提示，第二次錯才揭示答案）
      for (var u = 0; u < 8; u++) {
        check('unfold quiz #' + (u + 1), function () {
          A._test.go('unfold'); st.shape = 'cube'; st.unfold.quiz = null; A._test.render();
          A._test.newUnfoldQuiz();
          var q = st.unfold.quiz;
          if (!q || !q.options || q.options.length !== 3) throw new Error('bad quiz options');
          var correct = q.options.filter(function (o) { return o.correct; }).length;
          var valid = q.options.filter(function (o) { return o.res && o.res.ok; }).length;
          if (correct !== 1) throw new Error(q.type + ' should have exactly 1 correct answer, got ' + correct);
          if (q.type === 'match' && valid !== 1) throw new Error('match should have 1 foldable option, got ' + valid);
          if (q.type === 'invalid' && valid !== 2) throw new Error('invalid should have 2 foldable options, got ' + valid);
          // 逐一作答（每個選項都測，重新生成題目）
          for (var i = 0; i < 3; i++) {
            A._test.newUnfoldQuiz();
            var qi = st.unfold.quiz;
            var isRight = !!qi.options[i].correct;
            A._test.answerUnfold(i);
            if (isRight) {
              if (!qi.answered || !qi.correctAnswer) throw new Error('correct answer not accepted');
              continue;
            }
            // 第一次答錯：只給提示，不揭示答案
            if (qi.answered) throw new Error('first wrong answer must not be revealed');
            if (!qi.hint) throw new Error('no hint after first wrong answer');
            if (!document.querySelector('#panel .feedback.hint')) throw new Error('hint not rendered');
            // 同一個錯選項不能再按
            A._test.answerUnfold(i);
            if (qi.answered) throw new Error('tried option should stay locked');
            // 第二次都答錯 → 揭示答案
            var other = -1;
            qi.options.forEach(function (o, k) { if (!o.correct && k !== i) other = k; });
            if (other < 0) throw new Error('no second wrong option');
            A._test.answerUnfold(other);
            if (!qi.answered) throw new Error('second wrong answer should reveal');
            if (qi.correctAnswer) throw new Error('second wrong answer marked correct');
            if (!document.querySelector('#panel .feedback.no')) throw new Error('reveal text not rendered');
            // 揭示後有「看正確答案的摺合動畫」按鈕
            var hasBtn = Array.prototype.some.call(document.querySelectorAll('#panel .btn'), function (b) {
              return /摺合|fold/i.test(b.textContent);
            });
            if (!hasBtn) throw new Error('no correct-net fold button');
          }
        });
      }

      // 提示與解釋必須引用立體自身的特徵（面數／棱／頂點／曲面）
      check('solid feature sentences match geometry counts', function () {
        ['cube', 'cuboid', 'triPrism', 'quadPrism', 'pentaPrism', 'hexaPrism',
          'triPyramid', 'quadPyramid', 'pentaPyramid'].forEach(function (id) {
          var c = PS.geo.info(id).counts;
          ['zh', 'en'].forEach(function (lang) {
            var s2 = PS.i18n.t('solid.feature.' + id, lang);
            [c.faces, c.edges, c.vertices].forEach(function (n) {
              if (s2.indexOf(String(n)) < 0) throw new Error(id + '/' + lang + ' feature missing count ' + n + ': ' + s2);
            });
          });
        });
        ['cylinder', 'cone', 'sphere'].forEach(function (id) {
          ['zh', 'en'].forEach(function (lang) {
            var s2 = PS.i18n.t('solid.feature.' + id, lang);
            if (!s2 || s2.length < 10) throw new Error(id + '/' + lang + ' feature missing');
            if (!/曲面|curved/i.test(s2)) throw new Error(id + '/' + lang + ' feature should mention curved surface: ' + s2);
          });
        });
      });

      check('unfold quiz hint + reveal use solid features', function () {
        A._test.go('unfold'); st.shape = 'cube'; st.unfold.quiz = null; A._test.render();
        A._test.newUnfoldQuiz();
        var q = st.unfold.quiz;
        if (!q) throw new Error('no net quiz');
        var feat = PS.i18n.t('solid.feature.' + q.target, 'zh');
        if (!feat) throw new Error('no feature text for ' + q.target);
        var wi = -1; q.options.forEach(function (o, i) { if (!o.correct) wi = i; });
        A._test.answerUnfold(wi);
        if (q.answered) throw new Error('first wrong must not reveal');
        if (!q.hint || q.hint.indexOf(feat) < 0) throw new Error('hint ignored solid features: ' + q.hint);
        var wi2 = -1; q.options.forEach(function (o, i) { if (!o.correct && i !== wi) wi2 = i; });
        A._test.answerUnfold(wi2);
        if (!q.answered) throw new Error('second wrong should reveal');
        var rv = document.querySelector('#panel .feedback.no');
        if (!rv || rv.textContent.indexOf(feat) < 0) throw new Error('reveal ignored solid features: ' + (rv ? rv.textContent : 'none'));
      });

      check('cut quiz hint + reveal use solid features', function () {
        A._test.go('cut'); st.shape = 'cube'; st.cut.quiz = null; st.cut.showResult = false; A._test.render();
        var feat = PS.i18n.t('solid.feature.cube', 'zh');
        var q = null;
        for (var k = 0; k < 40 && !q; k++) {
          A._test.newCutQuiz();
          if (st.cut.quiz.type === 'match') q = st.cut.quiz;
        }
        if (!q) throw new Error('no match cut quiz');
        var wi = -1; q.options.forEach(function (o, i) { if (!o.correct) wi = i; });
        A._test.answerCut(wi);
        if (q.answered) throw new Error('first wrong must not reveal');
        if (!q.hint || q.hint.indexOf(feat) < 0) throw new Error('cut hint ignored solid features: ' + q.hint);
        var wi2 = -1; q.options.forEach(function (o, i) { if (!o.correct && i !== wi) wi2 = i; });
        A._test.answerCut(wi2);
        if (!q.answered) throw new Error('second wrong should reveal');
        var rv = document.querySelector('#panel .feedback.no');
        if (!rv || rv.textContent.indexOf(feat) < 0) throw new Error('cut reveal ignored solid features: ' + (rv ? rv.textContent : 'none'));

        // 先猜一猜：第一次錯只給提示（不切開），第二次錯才切開並揭示
        st.cut.quiz = null; st.cut.showResult = false; st.cut.predicted = null;
        st.cut.predAttempts = 0; st.cut.predHint = null;
        st.cut.mode = 'horizontal'; st.cut.pos = 0; A._test.render();
        var actualKey = st.cut.section && st.cut.section.key;
        if (!st.cut.result || !actualKey) throw new Error('cube cut result missing');
        st.cut.predicted = (actualKey === 'circle') ? 'triangle' : 'circle';
        A._test.doCut();
        if (st.cut.showResult) throw new Error('first wrong prediction must not cut');
        if (!st.cut.predHint || st.cut.predHint.indexOf(feat) < 0) throw new Error('prediction hint ignored solid features: ' + st.cut.predHint);
        A._test.doCut();
        if (!st.cut.showResult) throw new Error('second wrong prediction should cut');
        var rv2 = document.querySelector('#panel .feedback.no');
        if (!rv2 || rv2.textContent.indexOf(feat) < 0) throw new Error('prediction reveal ignored solid features: ' + (rv2 ? rv2.textContent : 'none'));
      });

      check('quiz next button starts a new question directly', function () {
        A._test.go('unfold'); st.shape = 'cube'; st.unfold.quiz = null; A._test.render();
        A._test.newUnfoldQuiz();
        var q1 = st.unfold.quiz;
        var ci = -1; q1.options.forEach(function (o, i) { if (o.correct) ci = i; });
        A._test.answerUnfold(ci);
        if (!q1.answered) throw new Error('quiz should be answered');
        var btn = Array.prototype.filter.call(document.querySelectorAll('#panel .btn'), function (b) {
          return /下一題|Next/i.test(b.textContent);
        })[0];
        if (!btn) throw new Error('no next button after answering');
        btn.click();
        if (!st.unfold.quiz || st.unfold.quiz === q1) throw new Error('next should create a new net quiz');
        if (st.unfold.quiz.answered) throw new Error('new net quiz should be unanswered');
        if (!document.querySelector('#panel .options.nets')) throw new Error('new net quiz options not rendered');

        A._test.go('cut'); st.shape = 'cube'; st.cut.quiz = null; A._test.render();
        A._test.newCutQuiz();
        var cq = st.cut.quiz;
        if (cq.type !== 'target') {
          var cci = -1; cq.options.forEach(function (o, i) { if (o.correct) cci = i; });
          A._test.answerCut(cci);
          if (!cq.answered) throw new Error('cut quiz should be answered');
        }
        var nx = Array.prototype.filter.call(document.querySelectorAll('#panel .btn'), function (b) {
          return /下一題|Next/i.test(b.textContent);
        })[0];
        if (!nx) throw new Error('no cut next button');
        nx.click();
        if (!st.cut.quiz || st.cut.quiz === cq) throw new Error('cut next should create a new quiz directly');
        if (st.cut.quiz.type !== 'target' && st.cut.quiz.answered) throw new Error('new cut quiz should be unanswered');
      });

      // 4. 切割：所有模式 + 切割 + 印章 + 題型
      check('cut all modes', function () {
        A._test.go('cut'); st.shape = 'cube';
        ['horizontal', 'vertical', 'slant', 'diagonal'].forEach(function (m) {
          st.cut.mode = m; st.cut.showResult = false; A._test.render();
        });
      });

      check('cut controls: angle only for slant, position always; no free mode', function () {
        A._test.go('cut'); st.shape = 'cube'; st.cut.showResult = false;
        function panelText() { return document.getElementById('panel').textContent; }
        function sliderCount() { return document.querySelectorAll('#panel .slider').length; }
        // 自由角度按鈕已移除
        if (/自由角度|Free angle/.test(panelText())) throw new Error('free-angle chip still present');
        // 水平切 / 垂直切 / 對角切：只有位置滑桿（1 條），沒有角度滑桿
        ['horizontal', 'vertical', 'diagonal'].forEach(function (m) {
          st.cut.mode = m; A._test.render();
          if (sliderCount() !== 1) throw new Error(m + ' should have only the position slider, got ' + sliderCount());
          if (/角度|Angle/.test(panelText())) throw new Error(m + ' should not show an angle control');
        });
        // 斜切：角度 + 位置（2 條）
        st.cut.mode = 'slant'; A._test.render();
        if (sliderCount() !== 2) throw new Error('slant should have angle + position sliders, got ' + sliderCount());
        // 對角切是固定 45° 對角平面
        st.cut.mode = 'diagonal'; st.cut.pos = 0; st.cut.showResult = false; A._test.render();
        var dplane = st.cut.plane;
        var nrm = dplane && dplane.n ? dplane.n : null;
        if (!nrm || Math.abs(Math.abs(nrm[0]) - Math.abs(nrm[1])) > 1e-6 || Math.abs(nrm[2]) > 1e-6) {
          throw new Error('diagonal normal should be [±1,±1,0], got ' + JSON.stringify(nrm));
        }
        st.cut.mode = 'horizontal'; st.cut.pos = 0; A._test.render();
      });

      check('cut perform + separation + stamp', function () {
        A._test.go('cut'); st.shape = 'cube';
        st.cut.mode = 'horizontal'; st.cut.pos = 0; st.cut.angle = 40; st.cut.showResult = false;
        A._test.render();
        A._test.doCut();
        if (!st.cut.showResult) throw new Error('cut not applied');
        if (!st.cut.section) throw new Error('no section computed');
        // 2D 印章
        var cv = document.createElement('canvas'); cv.width = 360; cv.height = 360;
        A._test.drawStamp(cv, st.cut.section, 20, 1.2);
      });

      check('cut candidates + section keys for all solids', function () {
        IDS.forEach(function (id) {
          var solid = G.getSolid(id);
          var cands = A._test.candidateCuts(solid);
          cands.forEach(function (c) {
            if (!C.SHAPE_NAME[c.key]) throw new Error('unknown shape key ' + c.key + ' for ' + id);
          });
        });
      });

      check('cut quiz all three types, every option (2 attempts)', function () {
        A._test.go('cut'); st.shape = 'cube';
        var seen = {};
        for (var n = 0; n < 40; n++) {
          st.cut.quiz = null;
          A._test.newCutQuiz();
          var q = st.cut.quiz;
          if (!q) throw new Error('no quiz');
          seen[q.type] = (seen[q.type] || 0) + 1;
          if (q.type === 'target') {
            // 用幾何方法解出目標：找一個候選切法，其 key 與目標相符
            var solid = G.getSolid(st.shape);
            var cands = A._test.candidateCuts(solid);
            var solved = null;
            cands.forEach(function (c) { if (A._test.targetMatch(q.target, c.key)) solved = c; });
            if (solved) {
              st.cut.mode = solved.mode; st.cut.pos = solved.pos; st.cut.angle = 40;
              A._test.render();
              if (!st.cut.quiz.answered) throw new Error('target not detected as solved for ' + q.target);
            }
            // 目標題：答錯時第一次給提示、第二次才給正確做法
            st.cut.quiz = null; A._test.newCutQuiz();
            var tq = st.cut.quiz;
            if (tq.type === 'target' && !tq.answered) {
              st.cut.showResult = false;
              st.cut.predicted = null;
              A._test.doCut();
              if (st.cut.quiz.answered) throw new Error('target should not be answered by a wrong cut');
              if (!st.cut.quiz.hint) throw new Error('target hint missing after 1st attempt');
              A._test.doCut();
              if (!st.cut.quiz.hint) throw new Error('target hint missing after 2nd attempt');
              if (!document.querySelector('#panel .feedback.hint')) throw new Error('target hint not rendered');
            }
            continue;
          }
          // 逐個選項測試（每次重新生成題目，因為選項會重新洗牌）
          for (var i = 0; i < q.options.length; i++) {
            st.cut.quiz = null; A._test.newCutQuiz();
            var qq = st.cut.quiz;
            if (qq.type === 'target') continue;
            if (!qq.options[i]) continue;
            var isRight = !!qq.options[i].correct;
            A._test.answerCut(i);
            if (isRight) {
              if (!qq.answered || !qq.correctAnswer) throw new Error('correct answer not accepted');
              continue;
            }
            if (qq.answered) throw new Error('1st wrong cut answer must not be revealed');
            if (!qq.hint) throw new Error('cut hint missing');
            var other = -1;
            qq.options.forEach(function (o, k) { if (!o.correct && k !== i) other = k; });
            if (other < 0) {
              // 二選一：另一個就是正確答案
              for (var k2 = 0; k2 < qq.options.length; k2++) if (k2 !== i) other = k2;
              A._test.answerCut(other);
              if (!qq.answered || !qq.correctAnswer) throw new Error('remaining correct option not accepted');
              continue;
            }
            A._test.answerCut(other);
            if (!qq.answered) throw new Error('2nd wrong cut answer should reveal');
            if (qq.correctAnswer) throw new Error('2nd wrong cut answer marked correct');
            if (!document.querySelector('#panel .feedback.no')) throw new Error('cut reveal text missing');
          }
        }
        if (!seen.match || !seen.judge || !seen.target) throw new Error('did not observe all quiz types: ' + JSON.stringify(seen));
      });

      // 先猜一猜：第一次錯只給提示（不切開），第二次錯才切開並揭示答案
      check('cut prediction: two attempts', function () {
        A._test.go('cut'); st.shape = 'cube';
        st.cut.mode = 'horizontal'; st.cut.pos = 0;
        st.cut.showResult = false; st.cut.sep = 0; st.cut.predicted = null;
        st.cut.predAttempts = 0; st.cut.predHint = null; A._test.render();
        var sec = st.cut.section;
        if (!sec || sec.unsupported) throw new Error('no section to predict');
        var wrong = ['triangle', 'pentagon', 'hexagon', 'circle'].filter(function (k) {
          return !A._test.predMatches(k, sec.key);
        })[0];
        if (!wrong) throw new Error('no wrong prediction available');
        st.cut.predicted = wrong; A._test.render();
        A._test.doCut();
        if (st.cut.showResult) throw new Error('1st wrong prediction must not cut');
        if (!st.cut.predHint) throw new Error('prediction hint missing');
        if (!document.querySelector('#panel .feedback.hint')) throw new Error('prediction hint not rendered');
        st.cut.predHint = null; A._test.render();
        A._test.doCut();
        if (!st.cut.showResult) throw new Error('2nd wrong prediction should cut');
        if (!document.querySelector('#panel .feedback.no')) throw new Error('prediction reveal missing');
        // 切開之後預測選項鎖住，不能再偷看答案
        if (!document.querySelector('#panel .opt.locked')) throw new Error('prediction options should be locked after cut');
        // 正確的預測：答對
        st.cut.showResult = false; st.cut.predicted = null;
        st.cut.predAttempts = 0; st.cut.predHint = null; A._test.render();
        var sec2 = st.cut.section;
        st.cut.predicted = sec2.key; A._test.render();
        A._test.doCut();
        if (!st.cut.showResult) throw new Error('correct prediction should cut');
        if (!document.querySelector('#panel .feedback.ok')) throw new Error('correct prediction not praised');
      });

      // 5. 語言切換：切到英文後每個模組、每個立體都要能渲染
      check('home text follows language switch', function () {
        A._test.go('home');
        T.setLang('en');
        var t = document.querySelector('#home .hcard .t');
        if (!t) throw new Error('no home card title');
        if (/[\u3400-\u9FFF]/.test(t.textContent)) throw new Error('home still Chinese after EN: ' + t.textContent);
        if (!/[A-Za-z]/.test(t.textContent)) throw new Error('home not English: ' + t.textContent);
        T.setLang('zh');
        var t2 = document.querySelector('#home .hcard .t');
        if (!/[\u3400-\u9FFF]/.test(t2.textContent)) throw new Error('home not back to Chinese: ' + t2.textContent);
        var thumbs = document.querySelectorAll('#home .thumb3d canvas');
        if (thumbs.length !== 3) throw new Error('expected 3 home 3D thumbnails, got ' + thumbs.length);
      });
      check('switch to EN and render everything', function () {
        T.setLang('en');
        ['inspect', 'unfold', 'cut'].forEach(function (mode) {
          A._test.go(mode);
          IDS.forEach(function (id) { st.shape = id; A._test.render(); });
        });
        var btn = document.getElementById('btn-lang');
        if (!btn.textContent) throw new Error('lang button empty');
      });
      check('switch back to ZH and render everything', function () {
        T.setLang('zh');
        ['inspect', 'unfold', 'cut'].forEach(function (mode) {
          A._test.go(mode);
          IDS.forEach(function (id) { st.shape = id; A._test.render(); });
        });
      });

      // 5b. 主頁滿版：主頁時隱藏面板、舞台滿寬；進入模組後回復左右分欄
      check('home fills full width, panel hidden; modules split', function () {
        A._test.go('home');
        var wrap = document.getElementById('stage-wrap');
        var panel = document.getElementById('panel');
        if (panel.style.display !== 'none') throw new Error('panel should be hidden on home');
        if (wrap.style.flex.indexOf('100%') < 0) throw new Error('stage should be full width on home: ' + wrap.style.flex);
        var cards = document.querySelectorAll('#home .hcard');
        if (cards.length !== 3) throw new Error('expected 3 home cards, got ' + cards.length);
        A._test.go('inspect');
        if (panel.style.display !== 'block') throw new Error('panel should show in module');
        if (wrap.style.flex.indexOf('64%') < 0) throw new Error('stage should be ~64% in module: ' + wrap.style.flex);
      });

      // 頂欄只保留主頁與語言切換
      check('topbar has only home + language buttons', function () {
        var pills = document.querySelectorAll('#topbar .pill');
        if (pills.length !== 2) throw new Error('expected 2 topbar pills, got ' + pills.length);
        var modes = document.querySelectorAll('#topbar [data-mode]');
        if (modes.length !== 0) throw new Error('mode buttons should be removed');
      });

      // 6. 真實 DOM 點擊（事件處理）
      check('DOM clicks: topbar buttons', function () {
        document.getElementById('btn-lang').click();
        document.getElementById('btn-lang').click();
        document.getElementById('btn-home').click();
        Array.prototype.forEach.call(document.querySelectorAll('#topbar [data-mode]'), function (b) { b.click(); });
      });
      check('DOM clicks: solid chips + next/quiz buttons', function () {
        A._test.go('inspect');
        var chips = document.querySelectorAll('#panel .chip');
        if (!chips.length) throw new Error('no chips');
        for (var i = 0; i < chips.length; i++) chips[i].click();
        A._test.go('unfold');
        var chips2 = document.querySelectorAll('#panel .chip');
        for (var j = 0; j < chips2.length; j++) chips2[j].click();
        A._test.go('cut');
        var chips3 = document.querySelectorAll('#panel .chip');
        for (var k = 0; k < chips3.length; k++) chips3[k].click();
      });

      // 7. 觀察：透視模式 + 計數機（面半透明綠、棱藍、頂點黃）
      check('inspect xray toggle + overlays', function () {
        A._test.go('inspect'); st.shape = 'cube'; st.inspect.xray = false;
        st.inspect.edges = false; st.inspect.verts = false; A._test.render();
        var v = A._test.getViewer();
        var btns = document.querySelectorAll('#panel .big-toggle.alt');
        var found = false;
        Array.prototype.forEach.call(btns, function (b) {
          if (/X-Ray|透視|棱和頂點|edges/i.test(b.textContent)) { found = true; b.click(); }
        });
        if (!found) throw new Error('no X-Ray toggle button');
        if (!st.inspect.xray) throw new Error('xray state not enabled');
        if (v.xray !== true) throw new Error('viewer xray not applied');
        if (!v.solidMesh || v.solidMesh.material.transparent !== true) throw new Error('solid not transparent in xray');
        if (v.overlay.visible !== true) throw new Error('edges/vertices should auto-show in xray');
        // 關閉
        Array.prototype.forEach.call(document.querySelectorAll('#panel .big-toggle.alt'), function (b) {
          if (/X-Ray|透視|棱和頂點|edges/i.test(b.textContent)) b.click();
        });
        if (st.inspect.xray !== false || v.xray !== false) throw new Error('xray did not turn off');
      });

      check('inspect click-to-count sequence + highlight overlay', function () {
        A._test.go('inspect'); st.shape = 'cube'; st.inspect.counted = {}; st.inspect.order = []; st.inspect._shape = 'cube';
        A._test.render();
        A._test.onPick({ type: 'face', group: 0 });
        A._test.onPick({ type: 'face', group: 1 });
        var v = A._test.getViewer();
        if (!v.hlGroup || v.hlGroup.children.length !== 2) throw new Error('highlight overlay faces wrong: ' + (v.hlGroup ? v.hlGroup.children.length : 'null'));
        if (v.hlGroup.children[0].material.transparent !== true || v.hlGroup.children[0].material.opacity >= 1) throw new Error('highlight not semi-transparent green');
        st.inspect.counted = {}; st.inspect.order = []; A._test.render();
      });

      check('cut module independent from inspect X-Ray', function () {
        var v = A._test.getViewer();
        // 在觀察模組開啟 X-Ray
        A._test.go('inspect'); st.shape = 'cube'; st.inspect.xray = true; A._test.render();
        if (v.xray !== true) throw new Error('inspect xray should be on');
        // 進入切割：不可有 X-Ray 按鈕，且不可繼承半透明狀態
        A._test.go('cut'); st.shape = 'cube'; A._test.render();
        var btns = document.querySelectorAll('#panel .big-toggle.alt');
        var hasXr = false;
        Array.prototype.forEach.call(btns, function (b) { if (/X-Ray|透視|棱和頂點|edges/i.test(b.textContent)) hasXr = true; });
        if (hasXr) throw new Error('cut module should not show an X-Ray button');
        if (v.xray !== false) throw new Error('cut should not inherit xray');
        if (v.solidMesh && v.solidMesh.material.transparent) throw new Error('cut solid should be opaque');
        // 回到觀察：應記住原本的 X-Ray 狀態
        A._test.go('inspect'); A._test.render();
        if (v.xray !== true) throw new Error('inspect should remember xray state');
        st.inspect.xray = false; A._test.render();
      });

      check('cut position slider is draggable (no panel rebuild)', function () {
        A._test.go('cut'); st.shape = 'cube'; st.cut.mode = 'horizontal'; st.cut.pos = 0; st.cut.showResult = false;
        A._test.render();
        var inputs = document.querySelectorAll('#panel .slider');
        if (inputs.length < 1) throw new Error('expected a position slider, got ' + inputs.length);
        var posInp = inputs[inputs.length - 1];
        posInp.value = '40';
        posInp.dispatchEvent(new Event('input', { bubbles: true }));
        if (Math.abs(st.cut.pos - 0.4) > 1e-6) throw new Error('position not updated: ' + st.cut.pos);
        // 拖動後不應重建面板（同一個滑桿節點仍在文件內，才能繼續拖）
        if (!posInp.isConnected) throw new Error('panel rebuilt during drag (slider detached)');
        // 仍在同一個面板，且預覽平面已更新
        if (!st.cut.plane) throw new Error('cut plane not updated');
        // 檢查已移除的兩顆按鈕
        var panelTxt = document.getElementById('panel').textContent;
        if (/預覽切割平面|Preview cutting plane|一步一步切|Step by step/.test(panelTxt)) throw new Error('removed buttons still present');
        st.cut.pos = 0; A._test.render();
      });

      check('AI chat box (Cube Buddy) removed', function () {
        if (document.getElementById('buddy')) throw new Error('#buddy chat box still present');
        if (document.querySelector('#stage .bubble')) throw new Error('chat bubble still present');
        // 各模組都不應出現鼓勵氣泡
        ['inspect', 'unfold', 'cut'].forEach(function (v) {
          A._test.go(v); A._test.render();
          if (document.querySelector('#stage .bubble')) throw new Error('bubble visible in ' + v);
        });
      });

      check('no runtime errors during tests', function () { if (ERRORS.length) throw new Error(ERRORS.length + ' errors: ' + ERRORS[0]); });
    }

    if (document.readyState === 'complete') setTimeout(run, 0);
    else window.addEventListener('load', function () { setTimeout(run, 0); });
  })();
  </script>
</body>
</html>
